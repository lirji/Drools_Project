server:
  port: 8081  # 跟 LangChain4j 项目 (默认 8080) 错开，方便同时跑

spring:
  application:
    name: drools-demo

  # 默认连 MySQL (mysql profile)。clone 下来没装 MySQL 时, 用 H2 file 跑:
  #   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
  #   java -jar target/*.jar --spring.profiles.active=h2
  # 数据源细节按 profile 分到 application-mysql.yml / application-h2.yml。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  jpa:
    hibernate:
      ddl-auto: update      # 学习场景: 实体一改字段自动迁移; 生产不要用
    open-in-view: false
    show-sql: false

# Step 15: Actuator + Prometheus 指标暴露。
#   GET /actuator/prometheus  → Prometheus 抓取端点 (文本格式)
#   GET /actuator/metrics/drools.rules.fired → 单个指标的 JSON 视图 (调试用)
# 生产里 management.endpoints 通常单独开一个 port + 加鉴权, 学习场景全开在 8081。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: drools-demo   # 所有指标默认带上的公共 tag, 多实例时区分来源

# 活动营销 demo (com.lrj.drools.activity) 开关。
#   rule-engine.enabled=false 时优惠查询走旧 Java 逻辑 (取最大红包), 用于灰度对照/回滚;
#   true 时走 Drools 规则 (资格→阶梯→折扣合并), 引擎异常/空决策仍自动回退旧逻辑。
activity:
  marketing:
    # P1-8 四眼职责分离。默认 false(不改 demo)；开启后活动发布(上线)要求审批人身份(auth=JWT sub / dev=X-Actor header)
    # 且 ≠ 提交人——提交人不能自审自发。需控制台人流(用户身份/审批)配套，生产建议开。
    four-eyes-enabled: false
    rule-engine:
      enabled: true
      # P0-5 KieBase 缓存足迹加权预算(KB)。权重≈260KB+37KB×生成规则数(实测 ActivityKieBaseSizingTest),
      # maximumWeight 同时封顶堆与 Metaspace。默认 256MB=262144KB;生产按目标(租户数×活动数×档位)定,
      # 并配 -XX:MaxMetaspaceSize ≥ (共享 Drools 基础设施~80MB + 预算的 Metaspace 份额)。容量模型见 docs。
      cache-max-weight-kb: 262144
      # P1-17 fire 上界(护栏) = base + per-rule × 该 KieBase 编译规则数(**per-artifact**,大规则集给大预算)。
      # 成本随规则数线性(基准已证),故上界随规则数派生而非全局常量;超界 halt+warn,决策回退旧逻辑(fail-safe)。
      max-fires-base: 2000
      max-fires-per-rule: 200
    # 种入 demo 商品 + 商品池 (仅当 demo_product 空), 让前端「商品池」自动圈选可演示。
    # 测试不开此开关, 避免污染 ActivityMarketingFlowTest 的池断言。
    seed-demo-data: true
  # P0-4 多租户隔离 (Hibernate @TenantId)。租户来源: 默认 X-Tenant-Id header, auth.enabled=true 时从 JWT 的 aud 解析。
  # ⚠️ 诚实说明: 本 application.yml 是 **dev-run 配置**, 下面开了 dev-default + 关了 auth ——
  #    此档 X-Tenant-Id header 即权威身份(信谁填谁), 只适合本地/演示, **不是 fail-closed**。
  #    生产必须: dev-default-enabled=false(无 header→403) + auth.enabled=true(JWT 定租户)。这两项默认值都安全, 是本文件显式放开的。
  tenant:
    dev-default-enabled: true
    dev-default: __dev__
    # P0-3 接 Casdoor: enabled=true 时 /activity-marketing/** 需带 Casdoor 验签 JWT, 租户从 token 的 aud 解析
    # (信封 X-Tenant-Id 只校验须=解析出的租户, 否则 403; 绝不作来源)。默认 false → 保持 header 来源 (dev/测试不变)。
    # 开启前先跑 scratchpad/casdoor-m2m-verify.sh: 每租户独立 client_credentials 应用 + 唯一 secret + 跨租户互斥冒烟。
    auth:
      enabled: false
      issuer: http://localhost:8000
      jwk-set-uri: http://localhost:8000/.well-known/jwks
      # 命脉实测: Casdoor client_credentials 的 owner=admin(非组织), 故租户从 aud(client_id) 解析, 不用 owner。
      # aud 由 Casdoor 绑定到已认证 client + 每应用独立 secret → 不可伪造(跨租户 secret 互斥已冒烟证)。
      # client-tenant-map 显式映射优先(生产推荐=白名单), 缺则用 audience-templates 的 {tenant} 家族反解。
      client-tenant-map: {}
        # activity-acme-cid: acme
        # activity-beta-cid: beta
      audience-templates:
        - activity-{tenant}-cid
      # 控制台写端点(create/status)所需权限; 空=仅 authenticated。设为 scope/角色可让纯决策 M2M token 调不了运营写接口。
      console-write-authority: ""
      # P1-12: 启动 JWKS 连通/fail-fast 自检 + 有界超时(Casdoor 挂不拖住决策线程)。
      warmup-enabled: true
      jwks-fetch-timeout-ms: 2000
      # P1-12 last-good: 正常缓存 TTL + Casdoor 不可达时用旧密钥集续验签的窗口(0=关)。
      jwks-cache-ttl-ms: 300000
      jwks-outage-ttl-ms: 3600000
    # P1-13 每租户限流(进程内 token bucket, demo 切片)。默认关(不改 demo)。
    #   生产多实例须换 Redis token bucket/网关限流(否则总配额=N×单实例)并定义 Redis 宕机开/闭。
    quota:
      enabled: false
      per-tenant-qps: 50
      burst: 50

logging:
  level:
    com.lrj.drools: DEBUG
    org.drools: INFO
