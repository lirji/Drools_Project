server:
  port: 8081  # 跟 LangChain4j 项目 (默认 8080) 错开，方便同时跑

spring:
  application:
    name: drools-demo

  # Step 10: KieSession 序列化后存进 H2 file 模式 (./data 目录),
  # 重启后 byte[] 还在, unmarshall 后接着上次的 working memory 跑。
  # 改成 jdbc:h2:mem:... 就退化成进程内, 重启清空 — 拿来调试不污染磁盘也行。
  datasource:
    url: jdbc:h2:file:./data/drools-demo;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 学习场景: 实体一改字段自动迁移; 生产不要用
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true         # 浏览器 http://localhost:8081/h2-console 看表; jdbc-url 跟上面一致

logging:
  level:
    com.lrj.drools: DEBUG
    org.drools: INFO
