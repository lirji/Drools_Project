# 微服务化本地编排（M2.1/M2.2）—— 读写平面**物理拆分**为两个 Spring Boot 应用 + nginx 网关 + MySQL 单库双账号。
# 两个独立镜像：activity-console(写面 + Step1-18 + SPA) / activity-decision(只读决策，甩掉 kie-ci/dmn，jar 轻 37MB)。
# （M1.3 那版是"同一镜像按 activity.role 扮演两角色"；M2.1 后改为真物理拆分，各自独立镜像/依赖集/进程。）
#
#   docker compose -f deploy/docker-compose.yml up --build
#   浏览器开 http://localhost:8095/ui/console
#
# 拆分价值演示（gate：kill console 决策仍服务 / kill decision 不伤 console）：
#   docker compose -f deploy/docker-compose.yml stop console
#   curl -s -XPOST http://localhost:8095/api/decision/spu-discount -H 'Content-Type: application/json' \
#        -H 'X-Tenant-Id: acme' -d '{"spuIdList":[9001],"userId":1,"userTags":[],"orderAmount":200,"quantity":1}'
#   （console 挂了，decision 独立存活并决策；反之 stop decision 不影响 /ui 与 Step1~18）
#
# auth 档（Casdoor）：默认走 dev 档（无鉴权，X-Tenant-Id 即身份）。要接本机 Casdoor 见 application-mysql.yml。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: drools_demo
    ports: ["3307:3306"]
    volumes:
      # M2.2：首次初始化建 decision 只读账号（decision_ro，仅 SELECT）
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 控制台服务：写面 + Step1~18 + SPA 托管 + 唯一 DDL 执行者。用 root（读写 + 建表）。
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: activity-console
    image: activity-console:latest
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8080"          # 容器内统一 8080，nginx upstream 对齐
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: drools_demo
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update   # console 是唯一 DDL 执行者
    depends_on:
      mysql: { condition: service_healthy }
    # 健康 = 已连库 + 建好 schema（actuator health 含 db 探针）。decision 据此等 console 建表完成再 validate。
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  # 决策服务：只读决策热路径 + 发布代际轮询预热。**只读账号 decision_ro + ddl-auto=validate**（物理上不能写/建表）。
  decision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: activity-decision
    image: activity-decision:latest
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: drools_demo
      DECISION_DB_USERNAME: decision_ro       # 只读账号（mysql-init 建）；应用层再叠 validate 双保险
      DECISION_DB_PASSWORD: decision_ro_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate  # 决策不碰 DDL；只读账号建表也会被 MySQL 拒
    depends_on:
      mysql: { condition: service_healthy }
      console: { condition: service_healthy }  # 等 console **健康**（schema 已建），decision 才 validate 通过（service_started 不够，会撞 missing table）

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8095:80"]   # 8090 常被本机其它服务占用，用 8095；网关内部仍 :80
    depends_on: [console, decision]

  # M2.3 · Prometheus 抓取 console + decision 的 /actuator/prometheus（两独立进程各自指标端点）
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [console, decision]

  # M2.3 · Grafana 自动装配数据源 + 面板（Activity Services：两服务 HTTP/JVM/Metaspace/CPU 对比）
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # demo：免登录看板（生产勿开）
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
