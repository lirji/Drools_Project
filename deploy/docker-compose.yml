# 微服务化本地编排（M1.3）—— 让 drools-activity 更像生产：读写平面分实例部署 + nginx 网关 + MySQL。
# 同一个镜像按 activity.role 扮演 console / decision（低风险替代 Maven 物理拆分，见 RoleGateFilter）。
#
#   docker compose -f deploy/docker-compose.yml up --build
#   浏览器开 http://localhost:8090/ui/console
#
# 拆分价值演示：`docker compose stop console` 后，决策 API 仍可用：
#   curl -s -XPOST http://localhost:8090/api/decision/spu-discount -H 'Content-Type: application/json' \
#        -H 'X-Tenant-Id: acme' -d '{"spuIdList":[9001],"userId":1,"userTags":[],"orderAmount":200,"quantity":1}'
#   （console 挂了，decision 实例独立存活；反之 stop decision 不影响 /ui 与 Step1~18）
#
# auth 档（Casdoor）：默认此 compose 走 dev 档（无鉴权，X-Tenant-Id 即身份），不依赖 Casdoor。
#   要接本机 Casdoor，给 console/decision 加环境变量 activity.tenant.auth.enabled=true +
#   ACTIVITY_TENANT_AUTH_ISSUER=http://host.docker.internal:8000 等（见 application-mysql.yml）。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: drools_demo
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 控制台服务：写面 + Step1~18 + SPA 托管 + 唯一 DDL 执行者
  console:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: drools-activity:latest
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      ACTIVITY_ROLE: console
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: drools_demo
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      # 控制台是唯一 DDL 执行者
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql: { condition: service_healthy }

  # 决策服务：只读决策热路径。只读账号 + 不建表（ddl-auto=validate），甩掉写面依赖负载。
  decision:
    image: drools-activity:latest
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      ACTIVITY_ROLE: decision
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: drools_demo
      # 生产应换独立只读账号；demo 用同账号但 ddl-auto=validate（不改表结构）
      DB_USERNAME: root
      DB_PASSWORD: rootpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      mysql: { condition: service_healthy }
      console: { condition: service_started }  # 等 console 建好表，decision 才能 validate 通过

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8090:80"]
    depends_on: [console, decision]
