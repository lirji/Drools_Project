# nginx 前端与边缘网关（M1.3 起 / 决策 D3；M2.2 对接物理拆分的两应用）—— 独立托管 Vue + 按前缀反代。
# console / decision 是两个独立镜像（activity-console / activity-decision），容器内均 SERVER_PORT=8080。
# /ui/ 不再依赖 console JAR 内的静态资源，因此只重建本镜像即可独立发布前端。
events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 决策服务不可用时的降级：网关层不兜底业务（业务回退在决策服务内的 legacyMax），仅返回 503 让调用方重试。
    server {
        listen 80;
        root /usr/share/nginx/html;

        # SPA 持有短期 Bearer：禁止把 callback/query 作为 Referer 外带，并降低点击劫持/MIME 嗅探面。
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # 请求时解析 Docker DNS，避免 Docker Desktop 恢复容器时上游尚未注册导致 nginx 直接退出。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $console_upstream console:8080;
        set $decision_upstream decision:8080;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # 门户专用健康端点：控制面健康才视为入口可用。
        location = /healthz {
            proxy_pass http://$console_upstream/actuator/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            access_log off;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /ui {
            return 301 /ui/;
        }

        # 带内容哈希的 Vite 资源可长期缓存；文件不存在时直接 404，不回退 index.html。
        location ^~ /ui/assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Authorization code 出现在 query string；不写 access log、不缓存，避免一次性 code 落网关日志。
        location = /ui/auth/callback {
            access_log off;
            alias /usr/share/nginx/html/ui/index.html;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Vue history 路由统一回退入口；index.html 禁止缓存，确保前端发布后立即命中新版本。
        location /ui/ {
            try_files $uri $uri/ /ui/index.html;
            add_header Cache-Control "no-cache";
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # 决策热路径 → 只读决策服务
        location /api/decision/ {
            rewrite ^/api/decision/(.*)$ /decision/v1/$1 break;
            proxy_pass http://$decision_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;  # 透传 Bearer，不在网关终结鉴权
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
        }

        # 控制台写面/查询 → console 服务（保留 /activity-marketing 契约）
        location /api/console/ {
            rewrite ^/api/console/(.*)$ /activity-marketing/$1 break;
            proxy_pass http://$console_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Actor $http_x_actor;
        }

        # 旧演示台端点（Step1~18）、/activity-marketing、/actuator 与后端欢迎页 → console。
        location / {
            proxy_pass http://$console_upstream;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Actor $http_x_actor;
        }
    }
}
