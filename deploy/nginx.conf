# nginx 边缘网关（M1.3 起 / 决策 D3；M2.2 对接物理拆分的两应用）—— 前端产物同源托管 + 按前缀反代。
# console / decision 是两个独立镜像（activity-console / activity-decision），容器内均 SERVER_PORT=8080。
# 这台 nginx 就是"未来 API 网关"的原位替身；后端拆更多服务时只改这里的 upstream，前端零改动。
events {}
http {
    upstream console  { server console:8080; }
    upstream decision { server decision:8080; }

    # 决策服务不可用时的降级：网关层不兜底业务（业务回退在决策服务内的 legacyMax），仅返回 503 让调用方重试。
    server {
        listen 80;

        # 决策热路径 → 只读决策服务
        location /api/decision/ {
            proxy_pass http://decision/decision/v1/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;  # 透传 Bearer，不在网关终结鉴权
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
        }

        # 控制台写面/查询 → console 服务（保留 /activity-marketing 契约）
        location /api/console/ {
            proxy_pass http://console/activity-marketing/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Actor $http_x_actor;
        }

        # 前端 SPA（/ui/）与旧演示台端点（Step1~18、/activity-marketing、静态页）→ console
        # console 实例带 SPA 产物 + SpaForwardController，history 路由回退在其内部完成。
        location / {
            proxy_pass http://console;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Tenant-Id $http_x_tenant_id;
            proxy_set_header X-Actor $http_x_actor;
        }
    }
}
