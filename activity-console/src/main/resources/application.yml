server:
  port: 8081  # 跟 LangChain4j 项目 (默认 8080) 错开，方便同时跑

spring:
  application:
    name: activity-console

  # 默认连 MySQL (mysql profile)。clone 下来没装 MySQL 时, 用 H2 file 跑:
  #   ./mvnw -pl activity-console spring-boot:run -Dspring-boot.run.profiles=h2
  #   java -jar activity-console/target/*.jar --spring.profiles.active=h2
  # 数据源细节按 profile 分到 application-mysql.yml / application-h2.yml。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  jpa:
    hibernate:
      ddl-auto: update      # 本地开发便捷配置；正式环境应使用 Flyway/Liquibase 等版本化迁移
    open-in-view: false
    show-sql: false

# Step 15: Actuator + Prometheus 指标暴露。
#   GET /actuator/prometheus  → Prometheus 抓取端点 (文本格式)
#   GET /actuator/metrics/drools.rules.fired → 单个指标的 JSON 视图 (调试用)
# 正式环境通常为 management.endpoints 配置独立端口与鉴权；本地开发统一暴露在 8081。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: activity-console   # 所有指标默认带上的公共 tag, 多实例时区分来源

# 活动营销平台（com.lrj.drools.activity）配置。
#   权益算额、资格条件树与多活动合并固定走 Java 求值层；rule-engine.enabled 控制仍需 DRL 的规则能力，
#   关闭或执行失败时使用安全回退路径，不改变红包算额权威实现。
activity:
  marketing:
    # P1-8 四眼职责分离。开启后活动发布（上线）要求审批人身份（auth=JWT sub / dev=X-Actor header）
    # 且 ≠ 提交人——提交人不能自审自发。需控制台人流(用户身份/审批)配套，生产建议开。
    four-eyes-enabled: false
    rule-engine:
      enabled: true
      # P0-5 KieBase 缓存足迹加权预算(KB)。权重≈260KB+37KB×生成规则数(实测 ActivityKieBaseSizingTest),
      # maximumWeight 同时封顶堆与 Metaspace。默认 256MB=262144KB;生产按目标(租户数×活动数×档位)定,
      # 并配 -XX:MaxMetaspaceSize ≥ (共享 Drools 基础设施~80MB + 预算的 Metaspace 份额)。容量模型见 docs。
      cache-max-weight-kb: 262144
      # P1-17 fire 上界(护栏) = base + per-rule × 该 KieBase 编译规则数(**per-artifact**,大规则集给大预算)。
      # 成本随规则数线性(基准已证),故上界随规则数派生而非全局常量;超界 halt+warn,决策回退旧逻辑(fail-safe)。
      max-fires-base: 2000
      max-fires-per-rule: 200
    # M1.4 发布代际轮询预热。console 发布(上线)时 bump (tenant,bizLine) 代际; decision 侧后台按 interval 轮询,
    # 见到代际增长即预热该 (tenant,bizLine) 的全部 ACTIVE artifact——物理拆分(M2.2)后 decision 进程无需 console
    # 进程内直调也能发布后自动 warm。进程内直调(warmOnPublish→warmAsync)保留作双保险。
    #   enabled=false 关掉调度(仍可手动调 warmDueGenerations, 测试用); 物理拆分后 console 角色可关、decision 角色开。
    generation-poll:
      enabled: true
      interval-ms: 3000
    # 活动生命周期调度（仅 console 写平面执行）：
    #   PENDING_EFFECT(3) 到 activityStartTime 自动上线；ONLINE 超过 activityEndTime 自动下线。
    # 普通 NORMAL 草稿不会被扫描，必须由运营显式预约，避免未审批配置被后台误发布。
    lifecycle-schedule:
      # local=Spring @Scheduled；xxl=由 XXL-JOB activityLifecycleSweep 触发；off=完全关闭。
      # 三种模式互斥，默认 local 保持单机开发行为不变。
      mode: ${ACTIVITY_MARKETING_LIFECYCLE_SCHEDULE_MODE:local}
      interval-ms: 5000
      initial-delay-ms: 5000
      batch-size: 200
    # 可选的本地目录初始化。正式环境应由商品/门店主数据同步，默认禁止应用启动时自动造数。
    seed-catalog-data: false
    # 落库中国行政区划字典 (仅当 sys_district 空)。它是 district_ids / userDistrictId 那两个
    # 6 位代码字段的取值域，属于平台参考数据，正式环境也应启用。
    # ⚠️ 与上面 seed-catalog-data 不同, **测试里它是开着的**: console 没有 src/test/resources,
    #    测试直接吃这份 yml; 而 @SpringBootTest 会真的执行 CommandLineRunner
    #    (DistrictSeederTest 的「启动即落库」正是靠这一点), 且没有任何测试把它置 false。
    #    实测每个 Spring 上下文因此多花约 0.7s (ActivityIdempotencyTest 6.4s → 5.7s),
    #    console 侧约 33 个不同的 @TestPropertySource 组合 ≈ 20s。要省掉就照 seed-catalog-data 的老办法,
    #    在各测试的 @TestPropertySource 里逐个加 seed-district-data=false。
    seed-district-data: true
  # P0-4 多租户隔离 (Hibernate @TenantId)。租户来源: 默认 X-Tenant-Id header, auth.enabled=true 时从 JWT 的 aud 解析。
  # ⚠️ 诚实说明: 本 application.yml 是 **dev-run 配置**, 下面开了 dev-default + 关了 auth ——
  #    此档 X-Tenant-Id header 即权威身份(信谁填谁), 只适合本地开发, **不是 fail-closed**。
  #    生产必须: dev-default-enabled=false(无 header→403) + auth.enabled=true(JWT 定租户)。这两项默认值都安全, 是本文件显式放开的。
  tenant:
    dev-default-enabled: true
    dev-default: __dev__
    # P0-3 接 Casdoor: enabled=true 时 /activity-marketing/** 需带 Casdoor 验签 JWT, 租户从 token 的 aud 解析
    # (信封 X-Tenant-Id 只校验须=解析出的租户, 否则 403; 绝不作来源)。默认 false → 保持 header 来源 (dev/测试不变)。
    # 开启前先跑 scratchpad/casdoor-m2m-verify.sh: 每租户独立 client_credentials 应用 + 唯一 secret + 跨租户互斥冒烟。
    auth:
      enabled: false
      issuer: http://localhost:8000
      jwk-set-uri: http://localhost:8000/.well-known/jwks
      # 命脉实测: Casdoor client_credentials 的 owner=admin(非组织), 故租户从 aud(client_id) 解析, 不用 owner。
      # aud 由 Casdoor 绑定到已认证 client + 每应用独立 secret → 不可伪造(跨租户 secret 互斥已冒烟证)。
      # client-tenant-map 显式映射优先(生产推荐=白名单), 缺则用 audience-templates 的 {tenant} 家族反解。
      client-tenant-map: {}
        # activity-acme-cid: acme
        # activity-beta-cid: beta
      audience-templates:
        - activity-{tenant}-cid
      # 前端 OIDC 浏览器登录 (52-*.md): 每租户一个 SPA 公有应用 (authorization_code+PKCE, 无 secret),
      # 由 scratchpad/casdoor-spa-provision.sh 建。tenant→client_id; 其反向自动并入 aud→tenant 解析
      # (必须 map 级——-web- 后缀会被上面模板误反解成租户 "acme-web")。redirect-uri 须与 Casdoor 应用配置完全一致。
      redirect-uri: http://localhost:8099/index.html
      web-client-map:
        acme: activity-acme-web-cid
        beta: activity-beta-web-cid
      # 控制台写端点(create/status)所需权限; 空=仅 authenticated。设为 scope/角色可让纯决策 M2M token 调不了运营写接口。
      console-write-authority: ""
      # P1-12: 启动 JWKS 连通/fail-fast 自检 + 有界超时(Casdoor 挂不拖住决策线程)。
      warmup-enabled: true
      jwks-fetch-timeout-ms: 2000
      # P1-12 last-good: 正常缓存 TTL + Casdoor 不可达时用旧密钥集续验签的窗口(0=关)。
      jwks-cache-ttl-ms: 300000
      jwks-outage-ttl-ms: 3600000
    # P1-13 每租户限流（进程内 token bucket）。默认关闭；多实例正式环境应改为共享限流。
    #   生产多实例须换 Redis token bucket/网关限流(否则总配额=N×单实例)并定义 Redis 宕机开/闭。
    quota:
      enabled: false
      per-tenant-qps: 50
      burst: 50

# XXL-JOB 执行器仅在 lifecycle-schedule.mode=xxl 时创建。
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://localhost:8080}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:activity-console}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      log-path: ${XXL_JOB_EXECUTOR_LOG_PATH:./logs/xxl-job/jobhandler}
      log-retention-days: ${XXL_JOB_EXECUTOR_LOG_RETENTION_DAYS:30}

logging:
  level:
    com.lrj.drools: DEBUG
    org.drools: INFO
