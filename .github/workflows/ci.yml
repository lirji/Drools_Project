name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test and package Maven reactor
        run: ./mvnw --batch-mode package
      - name: Validate observability Compose overlay
        run: docker compose -f deploy/docker-compose.yml -f deploy/compose.observability.yml config -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  validation-e2e:
    needs: [backend, frontend]
    # 整栈 Docker + Playwright，单次 25-45 分钟——只在 PR 与 main 上跑，
    # 特性分支的日常 push 靠 backend/frontend 两个快 job 兜底。
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: validation-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      DROOLS_AUTH_ENABLED: "false"
      DROOLS_DEV_DEFAULT_ENABLED: "true"
      DROOLS_FOUR_EYES_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start validation stack
        timeout-minutes: 30
        run: ./deploy.sh --core-only
      - name: Run promotion validation E2E
        timeout-minutes: 15
        run: BASE=http://localhost:8095 npm --prefix frontend run e2e:validate
      - name: Upload validation failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-e2e-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/e2e-validation-fail-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Show validation stack diagnostics
        if: failure()
        run: |
          docker compose --project-name "${COMPOSE_PROJECT_NAME}" -f deploy/docker-compose.yml ps || true
          docker compose --project-name "${COMPOSE_PROJECT_NAME}" -f deploy/docker-compose.yml \
            logs --no-color --tail=200 mysql console decision gateway || true
      - name: Clean up validation stack
        if: always()
        run: |
          docker compose --project-name "${COMPOSE_PROJECT_NAME}" -f deploy/docker-compose.yml \
            down --volumes --remove-orphans || true
