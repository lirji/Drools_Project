<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>活动引擎控制台</title>
  <!-- FOUC 加固（Phase G）：在样式/脚本加载前同步回读主题偏好写 data-theme，消除深色用户的浅色闪现。
       必须是普通内联 <script>（非 module）——Vite 会把内联 module 抽成外部 chunk 使其失去同步阻塞性。main.ts 内同款逻辑幂等保留。 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('drools-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* 隐私模式忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
